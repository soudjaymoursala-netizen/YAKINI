  - name: Use Node.js 18
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: npm ci

  - name: Build
    run: npm run build

  - name: Configure Pages
    uses: actions/configure-pages@v3

  - name: Upload artifact (dist)
    uses: actions/upload-pages-artifact@v1
    with:
      path: ./dist
